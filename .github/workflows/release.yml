name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}${{ matrix.win_arch && format(' ({0})', matrix.win_arch) || '' }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-13
          - platform: macos-14
          - platform: ubuntu-latest
          - platform: windows-latest
            win_arch: x64
          - platform: windows-latest
            win_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libfuse2 || true

      - name: Add Rust target (Windows arm64)
        if: matrix.platform == 'windows-latest' && matrix.win_arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

      - name: Build unsigned bundle (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: pnpm tauri build

      - name: Prefetch NSIS tools (retry)
        if: matrix.platform == 'windows-latest' && matrix.win_arch == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-DownloadWithRetry {
            param(
              [Parameter(Mandatory = $true)][string]$Uri,
              [Parameter(Mandatory = $true)][string]$OutFile,
              [int]$Attempts = 5
            )
            for ($i = 1; $i -le $Attempts; $i++) {
              try {
                Write-Host "Downloading ($i/$Attempts): $Uri"
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing
                return
              } catch {
                Write-Host "Download failed: $($_.Exception.Message)"
                if ($i -eq $Attempts) { throw }
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }

          $nsisCache = Join-Path $env:LOCALAPPDATA "tauri\\NSIS"
          New-Item -ItemType Directory -Force -Path $nsisCache | Out-Null

          $zip = Join-Path $nsisCache "nsis-3.11.zip"
          Invoke-DownloadWithRetry `
            -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip" `
            -OutFile $zip

          # Extract into cache if makensis.exe not present yet.
          $makensis = Join-Path $nsisCache "makensis.exe"
          if (-not (Test-Path $makensis)) {
            $tmp = Join-Path $nsisCache "tmp"
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $tmp -Force

            $inner = Get-ChildItem -Path $tmp | Select-Object -First 1
            if ($inner -and (Test-Path (Join-Path $inner.FullName "makensis.exe"))) {
              Copy-Item -Path (Join-Path $inner.FullName "*") -Destination $nsisCache -Recurse -Force
            } else {
              Copy-Item -Path (Join-Path $tmp "*") -Destination $nsisCache -Recurse -Force
            }

            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          }

      - name: Build unsigned bundle (Windows x64)
        if: matrix.platform == 'windows-latest' && matrix.win_arch == 'x64'
        run: pnpm tauri build

      - name: Build unsigned app (Windows arm64, no bundle)
        if: matrix.platform == 'windows-latest' && matrix.win_arch == 'arm64'
        run: pnpm tauri build --target aarch64-pc-windows-msvc --no-bundle

      - name: Build unsigned bundle (Linux)
        if: matrix.platform == 'ubuntu-latest'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        shell: bash
        run: |
          set -euo pipefail

          # Tauri's AppImage bundling can fail on environments that can't execute
          # AppImages reliably. Use a fallback path that runs linuxdeploy directly.
          if pnpm tauri build --bundles appimage; then
            exit 0
          fi

          echo "Tauri AppImage bundling failed; running linuxdeploy fallback..."

          pnpm tauri build --no-bundle

          app_dir="src-tauri/target/release/bundle/appimage/Bruma.AppDir"
          if [[ ! -d "$app_dir" ]]; then
            echo "Expected AppDir not found: $app_dir"
            exit 1
          fi

          linuxdeploy="$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
          plugin_appimage="$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
          plugin_gtk="$HOME/.cache/tauri/linuxdeploy-plugin-gtk.sh"
          plugin_gstreamer="$HOME/.cache/tauri/linuxdeploy-plugin-gstreamer.sh"

          chmod +x "$linuxdeploy" "$plugin_appimage" "$plugin_gtk" "$plugin_gstreamer" || true

          (
            cd src-tauri
            APPIMAGE_EXTRACT_AND_RUN=1 \
              LINUXDEPLOY_PLUGIN_APPIMAGE="$plugin_appimage" \
              LINUXDEPLOY_PLUGIN_GTK="$plugin_gtk" \
              LINUXDEPLOY_PLUGIN_GSTREAMER="$plugin_gstreamer" \
              "$linuxdeploy" \
              --appdir "target/release/bundle/appimage/Bruma.AppDir" \
              --output appimage \
              -d "target/release/bundle/appimage/Bruma.AppDir/usr/share/applications/Bruma.desktop" \
              -i "target/release/bundle/appimage/Bruma.AppDir/Bruma.png"
          )

      - name: Collect release assets (macOS)
        if: matrix.platform == 'macos-13' || matrix.platform == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          arch="x64"
          if [[ "${{ matrix.platform }}" == "macos-14" ]]; then
            arch="aarch64"
          fi
          shopt -s nullglob
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_files[@]} -lt 1 ]]; then
            echo "No .dmg found in src-tauri/target/release/bundle/dmg/"
            exit 1
          fi
          cp "${dmg_files[0]}" "release-assets/bruma-v${{ steps.app_version.outputs.value }}-macos-${arch}.dmg"

      - name: Collect release assets (Windows x64 installers)
        if: matrix.platform == 'windows-latest' && matrix.win_arch == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = "${{ steps.app_version.outputs.value }}"

          $msi = Get-ChildItem -Path "src-tauri\\target\\release\\bundle\\msi\\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No .msi found under src-tauri\\target\\release\\bundle\\msi\\" }
          Copy-Item $msi.FullName "release-assets\\bruma-v$version-windows-x64.msi" -Force

          $nsisExe = Get-ChildItem -Path "src-tauri\\target\\release\\bundle\\nsis\\*.exe" | Select-Object -First 1
          if (-not $nsisExe) { throw "No NSIS .exe found under src-tauri\\target\\release\\bundle\\nsis\\" }
          Copy-Item $nsisExe.FullName "release-assets\\bruma-v$version-windows-x64-setup.exe" -Force

      - name: Build portable-full (Windows x64)
        if: matrix.platform == 'windows-latest' && matrix.win_arch == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = "${{ steps.app_version.outputs.value }}"

          $portableDir = "portable-full"
          Remove-Item -Recurse -Force $portableDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$portableDir\\WebView2" | Out-Null

          $appExe = "src-tauri\\target\\release\\bruma.exe"
          if (-not (Test-Path $appExe)) { throw "Expected app exe not found: $appExe" }
          Copy-Item $appExe "$portableDir\\Bruma.exe" -Force

          $webview2Version = "147.0.3912.86"
          $nupkg = "webview2-runtime-x64.$webview2Version.nupkg"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/WebView2.Runtime.X64/$webview2Version" -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath "webview2pkg" -Force
          Copy-Item "webview2pkg\\contentFiles\\any\\any\\WebView2\\*" "$portableDir\\WebView2" -Recurse -Force

          Compress-Archive -Path "$portableDir\\*" -DestinationPath "release-assets\\bruma-v$version-windows-x64-portable-full.zip" -Force

      - name: Build portable-full (Windows arm64)
        if: matrix.platform == 'windows-latest' && matrix.win_arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = "${{ steps.app_version.outputs.value }}"

          $portableDir = "portable-full-arm64"
          Remove-Item -Recurse -Force $portableDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$portableDir\\WebView2" | Out-Null

          $appExe = "src-tauri\\target\\aarch64-pc-windows-msvc\\release\\bruma.exe"
          if (-not (Test-Path $appExe)) { throw "Expected ARM64 app exe not found: $appExe" }
          Copy-Item $appExe "$portableDir\\Bruma.exe" -Force

          $webview2Version = "147.0.3912.86"
          $nupkg = "webview2-runtime-arm64.$webview2Version.nupkg"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/WebView2.Runtime.ARM64/$webview2Version" -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath "webview2pkg" -Force
          Copy-Item "webview2pkg\\contentFiles\\any\\any\\WebView2\\*" "$portableDir\\WebView2" -Recurse -Force

          Compress-Archive -Path "$portableDir\\*" -DestinationPath "release-assets\\bruma-v$version-windows-arm64-portable-full.zip" -Force

      - name: Collect release assets (Linux AppImage)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/*.AppImage)
          if [[ ${#appimages[@]} -lt 1 ]]; then
            echo "No .AppImage found in src-tauri/target/release/bundle/appimage/"
            exit 1
          fi
          cp "${appimages[0]}" "release-assets/bruma-v${{ steps.app_version.outputs.value }}-linux-x86_64.AppImage"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
