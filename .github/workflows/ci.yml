name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  tauri:
    name: Tauri (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          echo "value=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Tauri build (macOS)
        if: matrix.platform == 'macos-latest'
        run: pnpm tauri build --bundles app

      - name: Tauri build (Windows)
        if: matrix.platform == 'windows-latest'
        run: pnpm tauri build --bundles nsis

      - name: Archive macOS .app
        if: matrix.platform == 'macos-latest'
        shell: bash
        working-directory: src-tauri/target/release/bundle/macos
        run: tar -czf "Bruma_${{ steps.app_version.outputs.value }}_macos.app.tar.gz" Bruma.app

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          name: 'bruma-v${{ steps.app_version.outputs.value }}-${{ github.run_id }}'
          tag_name: 'draft-v${{ steps.app_version.outputs.value }}-${{ github.run_id }}-${{ matrix.platform }}'
          body: 'Draft release from CI run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          draft: true
          prerelease: true
          generate_release_notes: false
