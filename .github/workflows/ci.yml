name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Visual tests
        run: pnpm test:e2e

      - name: Build frontend
        run: pnpm build

  tauri:
    name: Tauri (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          echo "value=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tauri build (macOS)
        if: matrix.platform == 'macos-latest'
        run: pnpm exec tauri build --bundles app

      - name: Tauri build (Windows)
        if: matrix.platform == 'windows-latest'
        run: pnpm exec tauri build --bundles nsis

      - name: Tauri build (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm exec tauri build --bundles deb,rpm,appimage

      - name: Archive macOS .app
        if: matrix.platform == 'macos-latest'
        shell: bash
        working-directory: src-tauri/target/release/bundle/macos
        run: tar -czf "Bruma_${{ steps.app_version.outputs.value }}_macos.app.tar.gz" Bruma.app

      - name: Upload to draft release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.sig
          name: 'bruma-v${{ steps.app_version.outputs.value }}-${{ github.run_id }}'
          tag_name: 'draft-v${{ steps.app_version.outputs.value }}-${{ github.run_id }}-${{ matrix.platform }}'
          body: 'Draft release from CI run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          draft: true
          prerelease: true
          generate_release_notes: false

  e2e-windows:
    name: E2E nativo (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install tauri-driver
        run: cargo install tauri-driver --version "^2" --locked

      - name: Install Edge WebDriver matching WebView2
        shell: pwsh
        run: |
          $pv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          if (-not $pv) {
            $pv = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          }
          if (-not $pv) {
            $dir = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            $pv = $dir.Name
          }
          if (-not $pv) { throw 'WebView2 Runtime not found on the runner' }
          Write-Host "WebView2 Runtime version: $pv"
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'edgedriver'
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$pv/edgedriver_win64.zip" -OutFile $zip
          } catch {
            $major = $pv.Split('.')[0]
            $latest = (Invoke-WebRequest "https://msedgedriver.microsoft.com/LATEST_RELEASE_${major}_WINDOWS" -UseBasicParsing).Content.Trim()
            Write-Host "Exact driver $pv unavailable; falling back to $latest"
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$latest/edgedriver_win64.zip" -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath $dest -Force
          Add-Content $env:GITHUB_PATH $dest
          & (Join-Path $dest 'msedgedriver.exe') --version

      # Runner steps run elevated; elevated host apps ignore
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, so enable the DevTools port via
      # the WebView2 loader registry override instead.
      - name: Enable WebView2 remote debugging for bruma.exe
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\EmbeddedBrowserWebView\LoaderOverride\bruma.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'additionalBrowserArguments' -Value '--remote-debugging-port=0' -PropertyType String -Force | Out-Null
          Get-ItemProperty $key | Select-Object -ExpandProperty additionalBrowserArguments

      # Diagnostics: can the app itself bring up WebView2 + DevTools on this
      # runner, independent of msedgedriver?
      - name: Diagnose WebView2 launch
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "$PWD\src-tauri\target"
          pnpm tauri build --debug --no-bundle
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $exe = 'src-tauri\target\debug\bruma.exe'
          $proc = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          Write-Host "bruma exited: $($proc.HasExited) (code $($proc.ExitCode))"
          Get-Process bruma -ErrorAction SilentlyContinue | Format-Table Id,ProcessName,MainWindowTitle,MainWindowHandle
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Format-Table Id,ProcessName
          Get-ChildItem "$PWD\src-tauri\target\debug\bruma.exe.WebView2" -ErrorAction SilentlyContinue | Select-Object Name
          Get-Content "$PWD\src-tauri\target\debug\bruma.exe.WebView2\DevToolsActivePort" -ErrorAction SilentlyContinue
          try { (Invoke-WebRequest 'http://localhost:9222/json/version' -UseBasicParsing).Content } catch { Write-Host "port probe failed: $_" }
          Get-WinEvent -LogName Application -MaxEvents 10 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'bruma|msedgewebview' } | Format-List TimeCreated,Message
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

      - name: Run native E2E (clipboard D1 + V-matrix subset)
        run: pnpm test:e2e:tauri
        env:
          TAURI_E2E_REQUIRED: '1'
