[package]
name = "bruma"
version = "1.8.0"
description = "Editor Markdown de escritorio: ligero, local y simple."
authors = ["mindbreaker81"]
edition = "2021"
license = "MIT"

[lib]
name = "bruma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-process = "2"

[lints]
rust = { warnings = "warn" }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version as tauri-runtime-wry to access WebView::execute_editing_command
# for the Edit menu clipboard items (GTK predefined items are no-ops on the
# WebKitWebView without libxdo).
webkit2gtk = "=2.0.2"

[target.'cfg(windows)'.dependencies]
# Same major version as tauri-runtime-wry so `HWND` matches `window.hwnd()`.
# Used by drag_drop.rs to register our own OLE IDropTarget on the WebView2
# child windows (wry only registers on HWNDs that already have a drop target,
# which breaks `tauri://drag-*` on recent WebView2 runtimes).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
